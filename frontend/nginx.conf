# Rendered by envsubst. Only the private Compose network is trusted.
set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=entry:10m rate=30r/m;
log_format classroom '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name ${CLASSROOM_DOMAIN};
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout classroom;
    client_max_body_size 64m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://${CLASSROOM_DOMAIN}; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location ~ ^/api/(auth/login|join/redeem|homework-portal/redeem|parent-portal/open)$ {
        limit_req zone=entry burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
